name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: BASE_PATH=/ pnpm --filter @workspace/chat-ui run build
        env:
          NODE_ENV: production
          PORT: "3000"

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production

      - name: Create self-contained deployment package
        run: |
          mkdir -p /tmp/azure-deploy

          # Copy the bundled backend (esbuild bundles everything except @azure/* packages)
          cp -r artifacts/api-server/dist /tmp/azure-deploy/dist

          # Create a minimal package.json - only @azure/* packages need node_modules
          # (express, pino, cors, etc. are all bundled by esbuild into dist/index.mjs)
          cat > /tmp/azure-deploy/package.json << 'EOF'
          {
            "name": "azure-chat-app",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node --enable-source-maps ./dist/index.mjs"
            },
            "dependencies": {
              "@azure/ai-agents": "^1.1.0",
              "@azure/core-auth": "^1.10.1",
              "@azure/identity": "^4.13.1"
            }
          }
          EOF

          # Install only the Azure packages using npm (flat node_modules, no symlinks)
          cd /tmp/azure-deploy && npm install --omit=dev

          # Copy built frontend so Express can serve it in production
          mkdir -p /tmp/azure-deploy/artifacts/chat-ui/dist
          cp -r $GITHUB_WORKSPACE/artifacts/chat-ui/dist/public /tmp/azure-deploy/artifacts/chat-ui/dist/public

          # Zip the deployment package
          cd /tmp/azure-deploy && zip -r $GITHUB_WORKSPACE/deploy.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
